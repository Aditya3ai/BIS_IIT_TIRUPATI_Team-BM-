<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>BIS Retriever — Demo UI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
  </head>
  <body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
      <div class="container-fluid">
        <a class="navbar-brand fw-bold" href="#">BM@% — BIS Retriever</a>
        <div class="collapse navbar-collapse">
          <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
            <li class="nav-item"><a class="nav-link" href="/instructions">Instructions</a></li>
          </ul>
          <span class="navbar-text text-white">IIT Tirupati Hackathon — Sigma Squad</span>
        </div>
      </div>
    </nav>

    <div class="container py-4">
      <div class="row">
        <div class="col-lg-4 mb-4">
          <div class="card shadow-sm">
            <div class="card-body">
              <h5 class="card-title">Search BIS Standards</h5>
              <p class="text-muted small">Enter a short query and press Run Inference.</p>
              <div class="mb-3">
                <label for="query" class="form-label">Query</label>
                <input type="text" class="form-control" id="query" placeholder="e.g. 33 Grade OPC or masonry cement">
              </div>
              <div class="mb-3">
                <label for="top_k" class="form-label">Top K</label>
                <input type="number" id="top_k" class="form-control" value="5" min="1" max="20">
              </div>
              <div class="d-flex gap-2">
                <button type="button" id="submit" class="btn btn-primary flex-grow-1">Run Inference</button>
                <a href="/instructions" class="btn btn-outline-secondary">Help</a>
              </div>
            </div>
          </div>
          <div class="mt-3 text-center text-muted small">Team: <strong>BM@%</strong></div>
        </div>

        <div class="col-lg-8">
          <div id="results area">
            <div id="results" class="mb-3">
              <div class="placeholder p-5 text-center text-muted">No results yet — run a query above.</div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <footer class="footer bg-white border-top py-3">
      <div class="container text-center small text-muted">BM@% • IIT Tirupati Hackathon — Sigma Squad</div>
    </footer>

    <script>
      function normalizeId(s){
        let standardId = String(s||'');
        standardId = standardId.replace(/PART/g,'Part');
        standardId = standardId.replace(/\s+/g,' ').trim();
        return standardId;
      }

      function renderResults(data){
        const resDiv = document.getElementById('results');
        if(data.error){ resDiv.innerHTML = `<div class="alert alert-danger">${data.error}</div>`; return; }
        let html = `<div class="mb-3"><h5>Results for: <span class="text-primary">${data.query}</span></h5></div>`;
        html += '<div class="row g-3">';
        for(const r of data.results){
          const score = Number(r.score||0);
          const sid = normalizeId(r.standard_id);
          html += `<div class="col-12">
            <div class="card result-card shadow-sm">
              <div class="card-body d-flex justify-content-between align-items-start">
                <div>
                  <div class="h6 mb-1"><span class="badge bg-secondary me-2">#${r.rank||'?'}</span>${sid}</div>
                  <div class="text-muted small">${r.title||''}</div>
                  <div class="mt-2 text-success small">${r.rationale||''}</div>
                </div>
                <div class="text-end">
                  <div class="fw-bold">${score.toFixed(6)}</div>
                  <div class="small text-muted">score</div>
                </div>
              </div>
            </div>
          </div>`;
        }
        html += '</div>';
        resDiv.innerHTML = html;
      }

      document.getElementById('submit').addEventListener('click', async ()=>{
        const q = document.getElementById('query').value;
        const top_k = Number(document.getElementById('top_k').value||5);
        const resDiv = document.getElementById('results');
        resDiv.innerHTML = '<div class="p-4 text-center text-muted">Running inference…</div>';
        const resp = await fetch('/infer',{
          method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({query: q, top_k: top_k})
        });
        const data = await resp.json();
        renderResults(data);
      });
    </script>
  </body>
</html>
